<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#b91c1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>Elemental Bending Arena: Agni Kai</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100dvh; overflow: hidden; background: #09090b; font-family: 'Segoe UI', Roboto, sans-serif; color: #f4f4f5; }
    #gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

    /* DLS-Style Landscape Rotate Prompt when held upright */
    #rotateOverlay {
      position: fixed; inset: 0; z-index: 99; background: #09090b;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
    }
    .phone-icon {
      width: 54px; height: 92px; border: 3px solid #fbbf24; border-radius: 12px;
      animation: rotateHint 1.8s ease-in-out infinite;
    }
    @keyframes rotateHint {
      0%, 20% { transform: rotate(0deg); }
      55%, 100% { transform: rotate(-90deg); }
    }
    @media screen and (orientation: portrait) and (max-width: 900px) {
      #rotateOverlay.active-guard { display: flex; }
    }

    /* One-Screen Compact Menu (Fits 100% without scrolling) */
    #menuOverlay {
      position: fixed; inset: 0; z-index: 20; height: 100dvh;
      background: radial-gradient(circle at center, rgba(28, 25, 23, 0.94), rgba(9, 9, 11, 0.99));
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 8px 12px 10px; overflow: hidden;
    }
    .header-box { text-align: center; }
    .title { font-size: clamp(1.05rem, 3.5vw, 1.75rem); font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #fbbf24; text-shadow: 0 2px 12px rgba(245, 158, 11, 0.5); }
    .subtitle { font-size: 0.7rem; color: #a1a1aa; }

    .panels-wrap {
      width: 100%; max-width: 860px; display: grid; grid-template-columns: 1fr; gap: 6px;
      flex: 1; align-content: center;
    }
    @media (orientation: landscape) {
      .panels-wrap { grid-template-columns: 1fr 1fr; gap: 8px; }
    }
    .panel { background: rgba(24, 24, 27, 0.95); border: 1px solid #3f3f46; border-radius: 10px; padding: 7px 9px; }
    .panel h3 { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.8px; color: #d4d4d8; margin-bottom: 5px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }

    .opt-btn {
      background: #27272a; border: 2px solid #3f3f46; border-radius: 8px; padding: 6px 3px;
      color: #e4e4e7; font-weight: 700; font-size: 0.7rem; line-height: 1.15; cursor: pointer; text-align: center;
    }
    .opt-btn small { font-size: 0.58rem; font-weight: 500; opacity: 0.85; }
    .opt-btn.active { border-color: #fbbf24; background: #422006; color: #fef08a; }
    .el-earth.active { border-color: #22c55e; background: #052e16; color: #bbf7d0; }
    .el-fire.active { border-color: #ef4444; background: #450a0a; color: #fecaca; }
    .el-water.active { border-color: #3b82f6; background: #172554; color: #bfdbfe; }
    .el-air.active { border-color: #f59e0b; background: #451a03; color: #fde68a; }

    .room-row { display: flex; gap: 5px; align-items: center; }
    .room-input {
      flex: 1; min-width: 0; background: #18181b; border: 1px solid #52525b; border-radius: 7px; padding: 5px 8px;
      color: #fff; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.72rem;
    }
    .mini-btn {
      background: #2563eb; border: none; border-radius: 7px; padding: 6px 10px; color: #fff;
      font-weight: 800; font-size: 0.7rem; cursor: pointer; white-space: nowrap;
    }
    #roomStatus { font-size: 0.66rem; color: #38bdf8; margin-top: 3px; }

    .start-btn {
      width: 100%; max-width: 860px; padding: 11px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #dc2626, #ea580c); color: #fff; font-size: 0.92rem; font-weight: 900;
      letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 18px rgba(220, 38, 38, 0.5);
    }

    /* Battle HUD */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
    .top-hud {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 72%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .round-banner { font-size: 0.68rem; font-weight: 800; letter-spacing: 1.5px; color: #fbbf24; background: rgba(0,0,0,0.75); padding: 2px 12px; border-radius: 20px; border: 1px solid #52525b; }
    .bars-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .fighter-box { flex: 1; background: rgba(9, 9, 11, 0.8); padding: 5px 8px; border-radius: 8px; border: 1px solid #3f3f46; }
    .fighter-meta { display: flex; justify-content: space-between; font-size: 0.68rem; font-weight: 700; margin-bottom: 3px; }
    .hp-track { width: 100%; height: 8px; background: #27272a; border-radius: 4px; overflow: hidden; margin-bottom: 3px; }
    .hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #16a34a, #4ade80); transition: width 0.1s; }
    .stam-track { width: 100%; height: 4px; background: #18181b; border-radius: 2px; overflow: hidden; margin-bottom: 2px; }
    .stam-fill { height: 100%; width: 100%; background: #facc15; transition: width 0.08s; }
    .chi-track { width: 100%; height: 4px; background: #18181b; border-radius: 2px; overflow: hidden; }
    .chi-fill { height: 100%; width: 100%; background: #38bdf8; transition: width 0.08s; }
    .diamonds { display: flex; gap: 4px; margin-top: 3px; }
    .diamond { width: 8px; height: 8px; transform: rotate(45deg); border: 1px solid #fbbf24; background: transparent; }
    .diamond.won { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }

    .top-actions { position: absolute; top: 8px; right: 10px; display: flex; gap: 5px; pointer-events: auto; z-index: 15; }
    .icon-btn { background: rgba(24,24,27,0.9); border: 1px solid #52525b; color: #fff; border-radius: 7px; padding: 5px 8px; font-size: 0.68rem; font-weight: 700; cursor: pointer; }
    .icon-btn.mic-on { border-color: #22c55e; background: #052e16; color: #86efac; }

    #comboBadge {
      position: absolute; top: 86px; left: 16px; font-size: 1rem; font-weight: 900; color: #fbbf24;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.2s;
    }

    #announce {
      position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(1.4rem, 4.5vw, 2.5rem); font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
      color: #fef08a; text-shadow: 0 4px 25px rgba(0,0,0,0.95); text-align: center; opacity: 0; transition: opacity 0.25s;
    }

    /* DLS-Style Landscape Left Stick + Right Martial-Arts & Bending Cluster */
    #joystickZone {
      position: absolute; bottom: 18px; left: 22px; width: 112px; height: 112px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.28);
      pointer-events: auto; touch-action: none;
    }
    #joystickKnob {
      position: absolute; top: 50%; left: 50%; width: 44px; height: 44px;
      margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(251, 191, 36, 0.85);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.55); pointer-events: none;
    }
    .ability-pad {
      position: absolute; bottom: 16px; right: 18px; display: grid; grid-template-columns: repeat(3, 56px); gap: 7px;
      pointer-events: auto;
    }
    .ab-btn {
      width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.42);
      background: rgba(24, 24, 27, 0.86); color: #fff; font-weight: 800; font-size: 0.62rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden;
    }
    .ab-btn span { font-size: 0.52rem; color: #a1a1aa; }
    .ab-melee { border-color: #facc15; background: rgba(63, 63, 70, 0.88); }
    .ab-ult { border-color: #ef4444; background: rgba(127, 29, 29, 0.9); }
    .cd-mask { position: absolute; bottom: 0; left: 0; right: 0; height: 0%; background: rgba(0,0,0,0.72); pointer-events: none; }

    #endModal {
      position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.86);
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- DLS Sideways Landscape Guard during Match -->
  <div id="rotateOverlay">
    <div class="phone-icon"></div>
    <div class="title" style="font-size:1.2rem;">Rotate Phone Sideways</div>
    <div class="subtitle">Best played in Landscape Mode like DLS</div>
    <button type="button" class="mini-btn" id="dismissRotateBtn">Continue Anyway</button>
  </div>

  <!-- One-Screen Menu -->
  <div id="menuOverlay">
    <div class="header-box">
      <div class="title">Elemental Bending Arena</div>
      <div class="subtitle">Martial Arts + Elemental Bending • Best Played Sideways</div>
    </div>

    <div class="panels-wrap">
      <div class="panel">
        <h3>1. Elemental Discipline</h3>
        <div class="grid-4" id="elementGroup">
