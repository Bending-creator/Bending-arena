<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#b91c1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>Elemental Bending Arena: Agni Kai</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0c10; font-family: 'Segoe UI', Roboto, sans-serif; color: #f4f4f5; }
    #gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

    /* Lobby & Character Select Screen */
    #menuOverlay {
      position: fixed; inset: 0; z-index: 20;
      background: radial-gradient(circle at center, rgba(28, 25, 23, 0.88), rgba(9, 9, 11, 0.98));
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
    }
    .title { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #fbbf24; text-shadow: 0 4px 20px rgba(245, 158, 11, 0.5); text-align: center; }
    .subtitle { font-size: 0.9rem; color: #a1a1aa; margin-bottom: 14px; text-align: center; }
    .panel { background: rgba(24, 24, 27, 0.9); border: 1px solid #3f3f46; border-radius: 14px; padding: 14px; width: 100%; max-width: 720px; margin-bottom: 12px; }
    .panel h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #d4d4d8; margin-bottom: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .opt-btn {
      background: #27272a; border: 2px solid #3f3f46; border-radius: 10px; padding: 10px 6px;
      color: #e4e4e7; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-align: center; transition: 0.15s;
    }
    .opt-btn.active { border-color: #fbbf24; background: #422006; color: #fef08a; transform: scale(1.02); }
    .el-earth.active { border-color: #22c55e; background: #052e16; color: #bbf7d0; }
    .el-fire.active { border-color: #ef4444; background: #450a0a; color: #fecaca; }
    .el-water.active { border-color: #3b82f6; background: #172554; color: #bfdbfe; }
    .el-air.active { border-color: #f59e0b; background: #451a03; color: #fde68a; }
    .start-btn {
      width: 100%; max-width: 720px; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #dc2626, #ea580c); color: #fff; font-size: 1.1rem; font-weight: 900;
      letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; box-shadow: 0 6px 24px rgba(220, 38, 38, 0.45);
    }

    /* Battle HUD */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
    .top-hud {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 680px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .round-banner { font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; color: #fbbf24; background: rgba(0,0,0,0.65); padding: 3px 12px; border-radius: 20px; border: 1px solid #52525b; }
    .bars-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .fighter-box { flex: 1; background: rgba(9, 9, 11, 0.75); padding: 6px 8px; border-radius: 8px; border: 1px solid #3f3f46; }
    .fighter-meta { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; }
    .hp-track { width: 100%; height: 10px; background: #27272a; border-radius: 5px; overflow: hidden; margin-bottom: 4px; }
    .hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #16a34a, #4ade80); transition: width 0.15s; }
    .chi-track { width: 100%; height: 5px; background: #18181b; border-radius: 3px; overflow: hidden; }
    .chi-fill { height: 100%; width: 100%; background: #38bdf8; transition: width 0.1s; }
    .diamonds { display: flex; gap: 4px; margin-top: 4px; }
    .diamond { width: 10px; height: 10px; transform: rotate(45deg); border: 1px solid #fbbf24; background: transparent; }
    .diamond.won { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }

    /* Top Right Audio & Menu Controls */
    .top-actions { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; pointer-events: auto; }
    .icon-btn { background: rgba(24,24,27,0.85); border: 1px solid #52525b; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

    /* Center Announcements */
    #announce {
      position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(1.6rem, 5vw, 3rem); font-weight: 900; text-transform: uppercase; letter-spacing: 3px;
      color: #fef08a; text-shadow: 0 4px 25px rgba(0,0,0,0.9); text-align: center; opacity: 0; transition: opacity 0.25s;
    }

    /* Mobile Touch Controls */
    #joystickZone {
      position: absolute; bottom: 24px; left: 24px; width: 120px; height: 120px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.22);
      pointer-events: auto; touch-action: none;
    }
    #joystickKnob {
      position: absolute; top: 50%; left: 50%; width: 48px; height: 48px;
      margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(251, 191, 36, 0.75);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
    }
    .ability-pad {
      position: absolute; bottom: 22px; right: 20px; display: grid; grid-template-columns: repeat(2, 64px); gap: 10px;
      pointer-events: auto;
    }
    .ab-btn {
      width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
      background: rgba(24, 24, 27, 0.78); color: #fff; font-weight: 800; font-size: 0.72rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden;
    }
    .ab-btn span { font-size: 0.62rem; color: #a1a1aa; }
    .ab-ult { border-color: #f59e0b; background: rgba(120, 53, 15, 0.85); }
    .cd-mask { position: absolute; bottom: 0; left: 0; right: 0; height: 0%; background: rgba(0,0,0,0.68); pointer-events: none; }

    /* Match Over Modal */
    #endModal {
      position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.82);
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Character & Arena Select -->
  <div id="menuOverlay">
    <div class="title">Elemental Bending Arena</div>
    <div class="subtitle">Choose Your Discipline, Outfits & Arena Atmosphere</div>

    <div class="panel">
      <h3>1. Select Elemental Discipline</h3>
      <div class="grid-4" id="elementGroup">
        <button class="opt-btn el-earth active" data-val="earth">🪨 EARTH<br><small>Toph / Bumi</small></button>
        <button class="opt-btn el-fire" data-val="fire">🔥 FIRE<br><small>Iroh / Zuko</small></button>
        <button class="opt-btn el-water" data-val="water">🌊 WATER<br><small>Katara / Korra</small></button>
        <button class="opt-btn el-air" data-val="air">🌪️ AIR<br><small>Aang / Roku</small></button>
      </div>
    </div>

    <div class="panel">
      <h3>2. Martial-Arts Outfit Style</h3>
      <div class="grid-2" id="outfitGroup">
        <button class="opt-btn active" data-val="bare">🥋 Bare-Chested Sparring Trousers</button>
        <button class="opt-btn" data-val="tunic">👘 Traditional Layered Tunic</button>
      </div>
    </div>

    <div class="panel">
      <h3>3. Arena Theme & AI Difficulty</h3>
      <div class="grid-2" style="margin-bottom:8px;" id="arenaGroup">
        <button class="opt-btn active" data-val="stadium">☀️ Sunlit Pro Stadium</button>
        <button class="opt-btn" data-val="agni_kai">🔥 Twilight Agni Kai</button>
      </div>
      <div class="grid-3" id="diffGroup">
        <button class="opt-btn" data-val="novice">Novice AI</button>
        <button class="opt-btn active" data-val="master">Master AI</button>
        <button class="opt-btn" data-val="avatar">Avatar State AI</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn">Enter Arena (Best of 5)</button>
  </div>

  <!-- Active Combat HUD -->
  <div id="hud">
    <div class="top-hud">
      <div class="round-banner" id="roundBanner">BEST OF 5 • ROUND 1</div>
      <div class="bars-row">
        <div class="fighter-box">
          <div class="fighter-meta"><span id="pName">YOU (EARTH)</span><span id="pHpText">100</span></div>
          <div class="hp-track"><div class="hp-fill" id="pHpBar"></div></div>
          <div class="chi-track"><div class="chi-fill" id="pChiBar"></div></div>
          <div class="diamonds" id="pRounds"><div class="diamond"></div><div class="diamond"></div><div class="diamond"></div></div>
        </div>
        <div class="fighter-box">
          <div class="fighter-meta"><span id="aiName">RIVAL (FIRE)</span><span id="aiHpText">100</span></div>
          <div class="hp-track"><div class="hp-fill" id="aiHpBar"></div></div>
          <div class="chi-track"><div class="chi-fill" id="aiChiBar"></div></div>
          <div class="diamonds" id="aiRounds"><div class="diamond"></div><div class="diamond"></div><div class="diamond"></div></div>
        </div>
      </div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="musicToggle">🎵 Music: ON</button>
      <button class="icon-btn" id="exitBtn">Exit</button>
    </div>
